<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
  <script>
    // Flutter *debug* web (DDC + DWDS) hoists main into window.$dartRunMain
    // and only invokes it after a DWDS RunRequest (debugger / Dart Debug
    // Extension). Reloading localhost in a normal Chrome tab never sends
    // that request, so the page stays blank with no JavaScript exception.
    //
    // A one-shot 2s call is not enough: $dartRunMain may exist before
    // $dartMainTearOffs is populated. Calling it then sets
    // $dartMainExecuted=true with an empty tear-off list, and a naive
    // "already executed" check never retries. Keep kicking until a
    // Flutter view actually attaches.
    (function () {
      function hasFlutterUi() {
        return !!(
          document.querySelector('flutter-view') ||
          document.querySelector('flt-glass-pane') ||
          document.querySelector('flt-scene-host')
        );
      }

      function tearOffCount() {
        var list = window.$dartMainTearOffs;
        return Array.isArray(list) ? list.length : 0;
      }

      function tryRunMain() {
        if (typeof window.$dartReadyToRunMain === 'function') {
          try { window.$dartReadyToRunMain(); } catch (e) {}
        }
        if (typeof window.$dartRunMain !== 'function') return false;
        try {
          window.$dartRunMain();
          return true;
        } catch (e) {
          return false;
        }
      }

      var startedAt = Date.now();
      var invokedWithTearOffs = false;
      var timer = setInterval(function () {
        if (hasFlutterUi()) {
          clearInterval(timer);
          return;
        }
        var elapsed = Date.now() - startedAt;
        var n = tearOffCount();
        // Wait for DWDS to hoist main into $dartMainTearOffs. Calling
        // $dartRunMain before that sets $dartMainExecuted with an empty
        // list and the app never starts. If DWDS already ran main, skip.
        if (n > 0 && !invokedWithTearOffs && !window.$dartMainExecuted) {
          invokedWithTearOffs = true;
          tryRunMain();
          return;
        }
        if (elapsed >= 120000) {
          clearInterval(timer);
        }
      }, 100);
    })();
  </script>
</body>
</html>
