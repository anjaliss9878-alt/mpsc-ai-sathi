[build]
  command = "bash tool/netlify_build.sh"
  publish = "build/web"

[build.environment]
  NODE_VERSION = "20"
  FLUTTER_VERSION = "3.44.4"

[functions]
  directory = "netlify/functions"
  node_bundler = "nft"

# AI backend (secrets live in Netlify env, not the Flutter JS bundle)
[[redirects]]
  from = "/health"
  to = "/.netlify/functions/health"
  status = 200

[[redirects]]
  from = "/ai/lesson"
  to = "/.netlify/functions/ai-lesson"
  status = 200

[[redirects]]
  from = "/ai/doubt"
  to = "/.netlify/functions/ai-doubt"
  status = 200

[[redirects]]
  from = "/ai/tts"
  to = "/.netlify/functions/ai-tts"
  status = 200

[[redirects]]
  from = "/rag/extract"
  to = "/.netlify/functions/rag-extract"
  status = 200

[[redirects]]
  from = "/rag/embed"
  to = "/.netlify/functions/rag-embed"
  status = 200

[[redirects]]
  from = "/rag/learn"
  to = "/.netlify/functions/rag-learn"
  status = 200

[[redirects]]
  from = "/rag/retrieve"
  to = "/.netlify/functions/rag-retrieve"
  status = 200

[[redirects]]
  from = "/rag/vertex-embed"
  to = "/.netlify/functions/rag-vertex-embed"
  status = 200

[[redirects]]
  from = "/rag/vertex-learn"
  to = "/.netlify/functions/rag-vertex-learn"
  status = 200

# Flutter web SPA fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
